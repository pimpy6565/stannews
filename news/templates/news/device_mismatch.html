<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab Ops — wrong device</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: #09090b;
      color: #e4e4e7;
      padding: 24px;
    }
    .card {
      max-width: 28rem;
      width: 100%;
      background: #18181b;
      border: 1px solid #27272a;
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 10px 30px rgb(0 0 0 / 0.35);
    }
    .pill {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #fca5a5;
      background: #450a0a;
      border: 1px solid #7f1d1d;
      border-radius: 999px;
      padding: 4px 10px;
      margin-bottom: 14px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 18px;
      line-height: 1.5;
      color: #a1a1aa;
      font-size: 0.975rem;
    }
    a {
      color: #f87171;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="pill">Lab Ops</div>
    <h1>{{ headline }}</h1>
    <p>{{ message }}</p>
    <p><a href="/">← Back to Stan News</a></p>
  </div>
</body>
</html>
